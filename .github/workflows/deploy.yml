name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A second push while the first is still building would
# otherwise race it, and the older build could land last.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The grade-level rules are the point of the project, so a page that
      # breaks one fails the deploy rather than shipping.
      - name: Check content
        run: node scripts/lint-content.mjs

      # 554 pages of KaTeX. The default heap is not enough — bare `astro build`
      # runs out of memory partway through the level pages.
      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # AFTER the build, not before: this one reads dist/, because what matters
      # is the geometry of the SVG that actually landed in the HTML once its
      # props were applied. A malformed figure renders as a blank box, which
      # the build itself is perfectly happy about.
      - name: Check figures
        run: node scripts/check-figures.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
